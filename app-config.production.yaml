# Configuración del despliegue en Coolify. Se carga después de app-config.yaml y
# reemplaza lo que redefine. Todos los valores variables vienen del entorno del
# contenedor (ver docs/despliegue.md, sección «Variables de entorno»).

app:
  baseUrl: ${PORTAL_URL}

backend:
  baseUrl: ${PORTAL_URL}
  listen: ':7007'
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  cors:
    origin: ${PORTAL_URL}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  # Solo miembros de DevHRL con su cuenta de GitHub. El guest de app-config.yaml
  # se fusiona aquí (la configuración combina objetos, no los reemplaza), pero
  # el backend lo rechaza fuera de NODE_ENV=development y la página de ingreso
  # no lo muestra en producción.
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

# Dentro del contenedor no hay Docker: MkDocs viene instalado en la imagen y la
# documentación compilada se guarda en un volumen montado en /app/techdocs.
techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local
    local:
      publishDirectory: /app/techdocs

catalog:
  # Reemplaza la lista de app-config.yaml: dentro de la imagen el backend corre
  # desde /app, así que la ruta es ./catalog y no ../../catalog.
  locations:
    - type: file
      target: ./catalog/hrl.yaml
      rules:
        - allow: [Domain, System, Group, User]
