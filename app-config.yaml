app:
  title: Portal de Desarrollo HRL
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # La portada propia (modules/home) es la página de inicio.
    - page:home:
        config:
          path: /
          title: Inicio
    - page:catalog:
        config: { title: Catálogo }

    # Idioma: español por defecto, inglés como alternativa en Settings. Los
    # textos traducidos están en packages/app/translations (ver docs/idioma.md).
    - api:app/app-language:
        config:
          defaultLanguage: es
          availableLanguages: [es, en]

    # Títulos de página (cabecera y migas de pan). Son texto fijo en la
    # configuración, así que se ven en español en ambos idiomas; en la barra
    # lateral sí cambian con el idioma (modules/nav/BarraLateral.tsx).
    - page:scaffolder:
        config: { title: Crear }
    - page:api-docs:
        config: { title: APIs }
    - sub-page:scaffolder/templates:
        config: { title: Plantillas }
    - sub-page:scaffolder/tasks:
        config: { title: Tareas }
    - sub-page:scaffolder/actions:
        config: { title: Acciones }
    - sub-page:scaffolder/editor:
        config: { title: Editor de plantillas }
    - sub-page:scaffolder/templating-extensions:
        config: { title: Extensiones de plantillas }
    - page:catalog-graph:
        config: { title: Grafo del catálogo }
    - page:techdocs:
        config: { title: Documentación }
    # Sin registro manual: lo nuevo entra por las plantillas de Autoservicio o
    # por el descubrimiento de repos de DevHRL, así nada queda sin spec.system.
    - page:catalog-import: false
    - page:notifications:
        config: { title: Notificaciones }
    - page:search:
        config: { title: Búsqueda }
    - page:app-visualizer:
        config: { title: Visualizador }
    - page:user-settings:
        config: { title: Ajustes }
    - sub-page:user-settings/general:
        config: { title: General }
    - sub-page:user-settings/auth-providers:
        config: { title: Proveedores de autenticación }
    - sub-page:user-settings/feature-flags:
        config: { title: Funciones opcionales }
    # Pestañas de la ficha de una entidad.
    - entity-content:catalog/overview:
        config: { title: Resumen }
    # «Contexto» (modules/entidad/Tarjetas.tsx) reemplaza a «Acerca de».
    - entity-card:catalog/about: false
    - entity-content:techdocs:
        config: { title: Documentación }
    - entity-content:api-docs/definition:
        config: { title: Definición }
    - entity-content:api-docs/apis:
        config: { title: APIs }

    # Registro de visitas: alimenta los widgets «Más visitados» y «Visitados
    # recientemente» de la portada. Se guarda en las preferencias del usuario.
    - api:home/visits: true
    - app-root-element:home/visit-listener: true

    # La portada propia no usa los widgets del plugin home.
    - home-page-widget:home/toolkit: false
    - home-page-widget:home/world-clock: false
    - home-page-widget:home/random-joke: false
    - home-page-widget:home/starred-entities: false
    - home-page-widget:home/recently-visited: false
    - home-page-widget:home/most-visited: false
    - page:proyectos:
        config: { title: Proyectos }
    - page:calidad:
        config: { title: Calidad }
    - page:guia:
        config: { title: Primeros pasos }

organization:
  name: Hospital Regional de Loreto

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # Postgres en Docker (compose.yaml), el mismo motor que en el despliegue: así
  # no se cambia de base al migrar. Las credenciales vienen de .env o, si no
  # están, de los valores por defecto que pone iniciar.ps1.
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    # Invitado: solo para desarrollo local. Se quita antes de desplegar.
    guest: {}
    # OAuth App de la organización DevHRL. Los valores vienen de .env (ver .env.example).
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # El usuario de GitHub debe existir como User en el catálogo
            # (lo importa githubOrg desde los miembros de DevHRL).
            - resolver: usernameMatchingUserEntityName
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, User, Group]

  # Descubrimiento: cada 30 min revisa todos los repos de DevHRL y registra los
  # que tengan catalog-info.yaml en la raíz de su rama por defecto. Un proyecto
  # nuevo aparece solo, sin tocar esta configuración.
  providers:
    github:
      devhrl:
        organization: DevHRL
        catalogPath: /catalog-info.yaml
        schedule:
          frequency: { minutes: 30 }
          timeout: { minutes: 3 }
          initialDelay: { seconds: 15 }
    # Miembros y equipos de DevHRL -> User y Group del catálogo.
    githubOrg:
      id: devhrl
      githubUrl: https://github.com
      orgs: ['DevHRL']
      schedule:
        frequency: { minutes: 60 }
        timeout: { minutes: 5 }
        initialDelay: { seconds: 10 }

  locations:
    # Estructura del hospital: dominio, sistemas y equipos. Los componentes no
    # van aquí: cada repo declara el suyo en su propio catalog-info.yaml.
    - type: file
      target: ../../catalog/hrl.yaml
      rules:
        - allow: [Domain, System, Resource, Group, User]
    # Caminos dorados: plantillas de la página «Crear» (plantillas/).
    - type: file
      target: ../../plantillas/nuevo-repositorio/template.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ../../plantillas/documentar-repositorio/template.yaml
      rules:
        - allow: [Template]
    # El propio portal no se registra aquí: está en DevHRL y lo encuentra el
    # descubrimiento, como cualquier otro repo.

# Calidad: datos que recoge packages/backend/src/modules/calidad.ts y reglas
# que los evalúan. El id de cada regla es el del frontend (modules/calidad),
# donde está su texto en los dos idiomas; `nivel` decide si cuenta para
# Bronce, Plata u Oro.
techInsights:
  factRetrievers:
    hrlCatalogo:
      cadence: '*/30 * * * *'
      initialDelay: { seconds: 30 }
      lifecycle: { maxItems: 60 }
    hrlRepositorio:
      # Descarga los archivos de cada repositorio: cada 6 horas basta.
      cadence: '15 */6 * * *'
      initialDelay: { minutes: 1 }
      timeout: { minutes: 10 }
      lifecycle: { maxItems: 30 }
  factChecker:
    checks:
      responsable:
        type: json-rules-engine
        name: Tiene responsable
        description: Su ficha declara spec.owner.
        factIds: [hrlCatalogo]
        metadata: { nivel: bronce }
        rule:
          conditions:
            all:
              - { fact: tieneResponsable, operator: equal, value: true }
      proyecto:
        type: json-rules-engine
        name: Pertenece a un proyecto
        description: Declara spec.system.
        factIds: [hrlCatalogo]
        metadata: { nivel: bronce }
        rule:
          conditions:
            all:
              - { fact: tieneProyecto, operator: equal, value: true }
      descripcion:
        type: json-rules-engine
        name: Tiene descripción
        description: metadata.description con al menos una frase.
        factIds: [hrlCatalogo]
        metadata: { nivel: bronce }
        rule:
          conditions:
            all:
              - { fact: descripcionSuficiente, operator: equal, value: true }
      documentacion:
        type: json-rules-engine
        name: Publica documentación
        description: Tiene la anotación de TechDocs.
        factIds: [hrlCatalogo]
        metadata: { nivel: plata }
        rule:
          conditions:
            all:
              - { fact: tieneDocs, operator: equal, value: true }
      repositorio:
        type: json-rules-engine
        name: Enlaza su repositorio
        description: Declara dónde está su código.
        factIds: [hrlCatalogo]
        metadata: { nivel: plata }
        rule:
          conditions:
            all:
              - { fact: tieneRepositorio, operator: equal, value: true }
      cicloDeVida:
        type: json-rules-engine
        name: Declara su ciclo de vida
        description: Tiene spec.lifecycle.
        factIds: [hrlCatalogo]
        metadata: { nivel: plata }
        rule:
          conditions:
            all:
              - { fact: tieneCicloDeVida, operator: equal, value: true }
      readme:
        type: json-rules-engine
        name: Tiene README
        description: Hay un README en la raíz del repositorio.
        factIds: [hrlRepositorio]
        metadata: { nivel: plata }
        rule:
          conditions:
            all:
              - { fact: tieneReadme, operator: equal, value: true }
      sinCredenciales:
        type: json-rules-engine
        name: Sin credenciales versionadas
        description: No hay archivos de credenciales ni .env en el repositorio.
        factIds: [hrlRepositorio]
        metadata: { nivel: plata }
        rule:
          conditions:
            all:
              - { fact: sinCredenciales, operator: equal, value: true }
      etiquetas:
        type: json-rules-engine
        name: Declara sus tecnologías
        description: Tiene metadata.tags.
        factIds: [hrlCatalogo]
        metadata: { nivel: oro }
        rule:
          conditions:
            all:
              - { fact: tieneEtiquetas, operator: equal, value: true }
      equipo:
        type: json-rules-engine
        name: Equipo con personas
        description: Su responsable es un equipo con miembros.
        factIds: [hrlCatalogo]
        metadata: { nivel: oro }
        rule:
          conditions:
            all:
              - { fact: equipoConMiembros, operator: equal, value: true }
      produccion:
        type: json-rules-engine
        name: En producción
        description: spec.lifecycle es production.
        factIds: [hrlCatalogo]
        metadata: { nivel: oro }
        rule:
          conditions:
            all:
              - { fact: enProduccion, operator: equal, value: true }
      codeowners:
        type: json-rules-engine
        name: Tiene CODEOWNERS
        description: GitHub sabe a quién pedir revisión.
        factIds: [hrlRepositorio]
        metadata: { nivel: oro }
        rule:
          conditions:
            all:
              - { fact: tieneCodeowners, operator: equal, value: true }
      kitFijado:
        type: json-rules-engine
        name: Kit fijado a una versión
        description: '@hrl/core-ui está fijado a un tag (o no lo usa).'
        factIds: [hrlRepositorio]
        metadata: { nivel: oro }
        rule:
          conditions:
            all:
              - { fact: kitFijado, operator: equal, value: true }

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'Portal de Desarrollo HRL' # defaults to "backstage"
  description: 'Herramientas para consultar el catálogo y la documentación de los sistemas del Hospital Regional de Loreto.'
