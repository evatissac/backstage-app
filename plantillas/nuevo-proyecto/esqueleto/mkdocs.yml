site_name: ${{ values.titulo | dump }}
site_description: ${{ values.descripcion | dump }}
# Botón «Editar esta página» en el portal: abre el archivo en GitHub.
repo_url: https://github.com/${{ values.repoSlug }}
edit_uri: edit/main/docs/
nav:
  - Inicio: index.md
  - Proceso: proceso/index.md
  - Arquitectura: arquitectura.md
  - Tecnologías: tecnologias.md
  - Decisiones:
      - decisiones/index.md
      - 0001 · Stack inicial: decisiones/0001-stack-inicial.md
plugins:
  - techdocs-core
