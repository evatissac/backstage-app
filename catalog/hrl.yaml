# Estructura del Hospital Regional de Loreto en el catálogo.
# Proyectos publicados: el Sistema de Reporte Estadístico y el Kit de UI.
# Los demás (Oncología, Plataforma) se agregan cuando estén listos para mostrarse.
# Aquí solo va lo que no pertenece a un repo concreto: el dominio, los sistemas,
# sus recursos y los equipos. Cada repo declara sus componentes en su propio
# catalog-info.yaml y los cuelga de uno de estos sistemas con `spec.system`.
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: salud-hrl
  title: Sistemas del HRL
  description: Sistemas de información desarrollados para el Hospital Regional de Loreto.
spec:
  owner: equipo-plataforma
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: reporte-estadistico
  annotations:
    # Color del proyecto en el portal (franja, monograma y cabecera).
    hrl/color: '#0e7490'
    # Plan del que sale la pestaña «Avance»: fases y entregas marcadas
    # [hecho], [en curso], [pendiente] o [bloqueado].
    hrl/avance: https://github.com/DevHRL/Estadistica_hrl/blob/main/docs/PLAN.md
  title: Sistema de Reporte Estadístico
  # Objetivo general del proyecto: es lo que muestra su tarjeta en el portal.
  description: >-
    Centraliza la estadística de todo el hospital: reúne en un solo envío lo que
    reportan las áreas, arma lo que se remite a DIRESA, calcula los indicadores
    de gestión y sostiene el boletín estadístico, el análisis situacional y la
    auditoría de datos.
  links:
    - url: https://github.com/DevHRL/Estadistica_hrl
      title: Repositorio
spec:
  owner: equipo-estadistica
  domain: salud-hrl
---
# Infraestructura de un proyecto que no vive en un repositorio. Los componentes
# que la usan lo declaran en su catalog-info.yaml con
# `dependsOn: [resource:bd-reporte-estadistico]`.
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: bd-reporte-estadistico
  title: Base de datos del Reporte Estadístico
  description: >-
    PostgreSQL con los reportes, sus estados, constancias y valores. La provee
    el servidor del hospital, fuera del repositorio. Solo cifras agregadas: sin
    datos de pacientes.
  tags:
    - postgresql
spec:
  type: database
  owner: equipo-estadistica
  system: reporte-estadistico
---
# Kit de UI del hospital. Sus componentes no se pueden pintar dentro del
# portal (el kit usa React 19 y Backstage React 18): la pestaña «Catálogo
# visual» muestra su Ladle compilado, que el kit publica en la rama `catalogo`
# (`ladle build --base ./`) y que el portal sirve él mismo.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: hrl-core-ui
  title: Kit de UI HRL
  annotations:
    hrl/color: '#4d7c0f'
    hrl/ladle: https://github.com/DevHRL/hrl-core-ui/tree/catalogo
  description: >-
    Sistema de diseño del Hospital Regional de Loreto: componentes React y
    tokens CSS que comparten todos los sistemas del hospital, con su catálogo
    visual.
  links:
    - url: https://github.com/DevHRL/hrl-core-ui
      title: Repositorio
spec:
  owner: equipo-plataforma
  domain: salud-hrl
---
# El componente del kit se declara aquí y no en su repositorio porque aún no
# se documentan los repos (docs/estado-y-pendientes.md, sección 4). Cuando el
# kit tenga su catalog-info.yaml, este bloque se quita.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hrl-core-ui
  title: '@hrl/core-ui'
  description: >-
    Paquete npm con los componentes React, los tokens CSS y la CLI de
    actualización del kit. Se instala fijado a un tag de versión.
  annotations:
    github.com/project-slug: DevHRL/hrl-core-ui
    backstage.io/source-location: url:https://github.com/DevHRL/hrl-core-ui/tree/main/
  tags:
    - react
    - css
spec:
  type: library
  lifecycle: production
  owner: equipo-plataforma
  system: hrl-core-ui
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: equipo-plataforma
  title: Equipo de Plataforma
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: equipo-estadistica
  title: Equipo de Estadística
spec:
  type: team
  children: []
