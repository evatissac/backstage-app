# Alternativa a la base local: el portal usa el PostgreSQL de Windows. Sirve en
# un equipo sin Postgres instalado (docker compose up -d --wait y, en .env,
# POSTGRES_PORT=5433). Misma imagen que el recurso PostgreSQL de Coolify, para
# que lo que funciona aquí funcione allá.
#
# Puerto 5433 y solo en 127.0.0.1: el 5432 lo ocupa el PostgreSQL de Windows,
# y la base no debe quedar accesible desde la red.
name: hrl-backstage

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backstage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backstage}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      # Desde la 18 la imagen guarda los datos en /var/lib/postgresql/18/docker:
      # el volumen se monta en la carpeta padre, no en .../data.
      - datos-pg18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  datos-pg18:
